<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>象棋 AI · M3/M4 对弈与分析</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #2b241c; color: #e8dcc8; margin: 0; display: flex; justify-content: center; overflow: hidden; }
  .wrap { display: flex; gap: 20px; padding: 20px; align-items: flex-start; flex-wrap: wrap; }
  .panel { background: #3a3227; border-radius: 12px; padding: 14px; width: 320px; max-height: calc(100vh - 40px); overflow-y: auto; flex-shrink: 0; }
  .panel::-webkit-scrollbar { width: 8px; }
  .panel::-webkit-scrollbar-thumb { background: #5a4c38; border-radius: 4px; }
  .panel::-webkit-scrollbar-track { background: transparent; }
  .panel h3 { margin: 0 0 8px; font-size: 14px; color: #f0e2c0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  select, input[type=text], input[type=number] { background: #241f18; color: #d8c9a8; border: 1px solid #555; border-radius: 6px; padding: 5px 8px; font-size: 13px; }
  input[type=text] { width: 100%; box-sizing: border-box; }
  button { background: #7a5c33; color: #fff; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
  button:hover { background: #8d6d3f; }
  button.primary { background: #2e7d43; }
  button.primary:hover { background: #37954f; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .palette { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .pcell { width: 40px; height: 40px; border-radius: 50%; background: #fdf6e3; border: 2px solid #999; font-size: 19px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .pcell.red { color: #b02a1e; border-color: #b02a1e; }
  .pcell.black { color: #1e3e6e; border-color: #1e3e6e; }
  .pcell.active { outline: 3px solid #f0a30a; }
  .pcell.del { background: #6b5d4a; color: #fff; border-color: #444; }
  textarea { width: 100%; box-sizing: border-box; height: 46px; background: #241f18; color: #d8c9a8; border: 1px solid #555; border-radius: 6px; font-size: 12px; padding: 6px; }
  .status { font-size: 14px; color: #ffd479; min-height: 20px; margin: 6px 0; font-weight: bold; }
  .analysis { font-size: 12.5px; line-height: 1.9; height: 96px; overflow-y: auto; background: #241f18; border-radius: 6px; padding: 8px; white-space: pre-wrap; }
  .analysis .top { color: #9fe1cb; }
  .note { font-size: 12px; color: #a89a7d; margin-top: 6px; }
  .boardWrap { position: relative; }
  .endBanner { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(178,34,22,.94); color: #fff; font-size: 30px; font-weight: bold; padding: 20px 44px; border-radius: 16px; box-shadow: 0 8px 28px rgba(0,0,0,.55); z-index: 10; letter-spacing: 3px; white-space: nowrap; }
  .endBanner.draw { background: rgba(58,110,66,.94); }
  .endBanner.show { display: block; animation: bannerPop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes bannerPop { 0% { transform: translate(-50%,-50%) scale(.3); opacity: 0; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
  .moveList { position: relative; display: none; max-height: 220px; overflow-y: auto; background: #241f18; border-radius: 6px; padding: 8px; font-size: 13px; line-height: 1.9; margin-top: 8px; }
  .moveList::-webkit-scrollbar { width: 8px; }
  .moveList::-webkit-scrollbar-thumb { background: #5a4c38; border-radius: 4px; }
  .moveList span { margin-right: 12px; white-space: nowrap; cursor: pointer; color: #d8c9a8; }
  .moveList span:hover { color: #fff; }
  .moveList span.cur { color: #f0a30a; font-weight: bold; }
  .moveList span .no { color: #7d7060; margin-right: 2px; font-size: 11px; }
  .moveList .mk { font-weight: bold; margin-left: 1px; }
  .moveList .mk-m1 { color: #f0a30a; }   /* ?! 缓着 */
  .moveList .mk-m2 { color: #ff7a59; }   /* ?  失误 */
  .moveList .mk-m3 { color: #ff3b30; }   /* ?? 大败 */
  .moveList .mk-m0 { color: #57c77a; }   /* ◎ 好棋 */
  .moveList .mk-unk { color: #7d7060; }  /* ？无标记 */
  canvas.curve { background: #241f18; border-radius: 6px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="boardWrap">
    <canvas id="board"></canvas>
    <div id="endBanner" class="endBanner"></div>
  </div>

  <div class="panel">
    <h3>对弈</h3>
    <div class="row">
      <button id="btnMode" class="primary">进入对弈</button>
      <button id="btnNew">新对局</button>
      <button id="btnUndo">悔棋</button>
    </div>
    <div class="row">
      <select id="gameMode" title="对局模式">
        <option value="pve">人机对弈</option>
        <option value="eve">机机对弈（强软对强软）</option>
      </select>
    </div>
    <div class="row" id="pveRow">
      <select id="humanSide" title="人机模式下你的执方">
        <option value="red">人执红（先行）</option>
        <option value="black">人执黑（后行）</option>
      </select>
      <span style="font-size:13px;align-self:center">引擎强度</span>
      <select id="strength" title="搜索深度分级；低档位叠加概率性次优着法模拟 ELO 分段棋力">
        <option value="1">入门（1层·约1200）</option>
        <option value="2">初级（2层·约1300）</option>
        <option value="3">业余（3层·约1400）</option>
        <option value="5">中级（5层·约1600）</option>
        <option value="8">高级（8层·约1800）</option>
        <option value="12">大师（12层·约2100）</option>
        <option value="18">特大师（18层·约2500）</option>
        <option value="24" selected>满级（24层·约2800）</option>
      </select>
      <span style="font-size:13px;align-self:center">让子</span>
      <select id="handicapSel" title="让子：引擎侧移除相应子力，只从初始局面开局时生效">
        <option value="0" selected>不让子</option>
        <option value="n1">让单马</option>
        <option value="n2">让双马</option>
        <option value="c1">让单炮</option>
        <option value="c2">让双炮</option>
        <option value="r1">让单车</option>
        <option value="rnc">让车马炮</option>
      </select>
    </div>
    <div id="eveRows" style="display:none">
      <div class="row">
        <span style="font-size:13px;align-self:center;width:34px">红方</span>
        <input type="text" id="redName" value="皮卡鱼·红" title="红方引擎名字，可自定义" style="width:110px" />
        <select id="redStrength" title="红方强度">
          <option value="1">入门（1层）</option>
          <option value="2">初级（2层）</option>
          <option value="3">业余（3层）</option>
          <option value="5">中级（5层）</option>
          <option value="8">高级（8层）</option>
          <option value="12">大师（12层）</option>
          <option value="18">特大师（18层）</option>
          <option value="24" selected>满级（24层）</option>
        </select>
      </div>
      <div class="row">
        <span style="font-size:13px;align-self:center;width:34px">黑方</span>
        <input type="text" id="blackName" value="皮卡鱼·黑" title="黑方引擎名字，可自定义" style="width:110px" />
        <select id="blackStrength" title="黑方强度">
          <option value="1">入门（1层）</option>
          <option value="2">初级（2层）</option>
          <option value="3">业余（3层）</option>
          <option value="5">中级（5层）</option>
          <option value="8">高级（8层）</option>
          <option value="12">大师（12层）</option>
          <option value="18">特大师（18层）</option>
          <option value="24" selected>满级（24层）</option>
        </select>
      </div>
      <div class="note">不限时限时按各自强度分深度对打</div>
    </div>
    <div class="row">
      <span style="font-size:13px;align-self:center">避和求胜</span>
      <select id="avoidDraw" title="引擎发现即将三次重复/子力和棋且自己不处败势时，自动改走评分可接受的替代着法，继续求胜">
        <option value="1" selected>开（推荐强软）</option>
        <option value="0">关（可接受和棋）</option>
      </select>
      <span style="font-size:13px;align-self:center">开局库</span>
      <select id="useBook" title="引擎对局前几步按开局库（名手开局序列）行棋">
        <option value="1" selected>开</option>
        <option value="0">关</option>
      </select>
    </div>
    <div class="row">
      <span style="font-size:13px;align-self:center">引擎线程</span>
      <select id="threadsSel" title="引擎计算线程数；自动 = CPU 核心数 - 2">
        <option value="auto" selected>自动</option>
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="6">6</option>
        <option value="8">8</option>
      </select>
      <span style="font-size:13px;align-self:center">哈希</span>
      <select id="hashSel" title="置换表内存大小（MB），越大思考越稳定">
        <option value="128">128MB</option>
        <option value="256">256MB</option>
        <option value="512" selected>512MB</option>
        <option value="1024">1024MB</option>
      </select>
    </div>
    <div class="note">避和求胜：引擎将主动避开三次重复/无进攻子力的和棋（已处败势时除外）</div>
    <div class="row">
      <span style="font-size:13px;align-self:center">赛制</span>
      <select id="clockModeSel" title="正式赛制：包干/加秒，超时判负；不选则只统计用时">
        <option value="0-0" selected>不限时</option>
        <option value="5-0">包干 5 分钟</option>
        <option value="10-0">包干 10 分钟</option>
        <option value="20-0">包干 20 分钟</option>
        <option value="10-5">10 分 + 5 秒</option>
        <option value="20-10">20 分 + 10 秒</option>
      </select>
    </div>
    <div class="row">
      <span style="font-size:13px;align-self:center">每步时限</span>
      <select id="timeLimit" title="每步思考时间限制（人机/机机通用）；不限则按强度深度">
        <option value="0">不限（按深度）</option>
        <option value="500">0.5秒</option>
        <option value="1000">1秒</option>
        <option value="2000" selected>2秒（推荐）</option>
        <option value="3000">3秒</option>
        <option value="5000">5秒</option>
        <option value="10000">10秒</option>
      </select>
      <span style="font-size:12px;color:#a89a7d;align-self:center">时限越短走得越快</span>
      <button id="btnSound" title="落子/吃子/将军音效开关">🔇音效:关</button>
    </div>
    <div class="note" id="openingName"></div>
    <div class="note" id="clock"></div>
    <div class="status" id="gameStatus">编辑模式：可摆子 / 载入 FEN</div>

    <h3>引擎（皮卡鱼 · UCI）</h3>
    <div class="row">
      <input type="text" id="enginePath" value="../engine/Pikafish-Windows-x86-64-universal.exe" title="相对 gui 目录或绝对路径" />
    </div>
    <div class="row">
      <button id="btnStartEngine">启动引擎</button>
      <span id="engineState" style="font-size:12px;color:#a89a7d;align-self:center">未启动</span>
    </div>

    <h3>实时分析（MultiPV 3）</h3>
    <div class="row">
      <button id="btnAnalysis">开启分析</button>
    </div>
    <div class="analysis" id="analysis">—</div>
    <canvas id="curve" class="curve" width="292" height="80"></canvas>
    <div class="note">胜率曲线：红方视角，随每步分析更新</div>

    <h3>棋谱保存 / 复盘</h3>
    <div class="row">
      <button id="btnSaveGame">保存棋谱</button>
      <button id="btnSavePgn">导出 PGN</button>
      <button id="btnSnap">导出局面图</button>
      <button id="btnLoadGame">打开棋谱复盘</button>
    </div>
    <div class="row" id="replayRow" style="display:none">
      <button id="btnRepFirst">|◀</button>
      <button id="btnRepPrev">◀</button>
      <button id="btnRepNext">▶</button>
      <button id="btnRepLast">▶|</button>
      <button id="btnRepPlay">自动</button>
      <button id="btnRepExit">退出复盘</button>
    </div>
    <div class="row" id="reviewRow" style="display:none">
      <button id="btnReview" class="primary">AI 点评</button>
      <span style="font-size:12px;color:#a89a7d;align-self:center">逐手评分标记 ◎/?!/?/??</span>
    </div>
    <div class="moveList" id="moveList"></div>
    <div class="note" id="reviewReport"></div>
    <div class="note" id="replayLabel"></div>

    <h3>名局欣赏（古谱《自出洞来无敌手》）</h3>
    <div class="row">
      <select id="classicCategory" title="古谱七类" style="flex:1;min-width:0"></select>
      <select id="classicGame" title="每类五局" style="flex:1;min-width:0"></select>
    </div>
    <div class="row">
      <button id="btnLoadClassic" class="primary">载入复盘</button>
      <span style="font-size:12px;color:#a89a7d;align-self:center" id="classicInfo"></span>
    </div>
    <div class="note">纯阳道人古谱 · 七类三十五局 · 全部得先胜 · 载入后可自动播放/逐步研习</div>
  </div>

  <div class="panel" id="editPanel">
    <h3>棋子编辑（仅编辑模式）</h3>
    <div class="palette" id="palette"></div>
    <h3>FEN</h3>
    <textarea id="fen"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="btnApply">载入 FEN</button>
      <button id="btnInitial">初始局面</button>
      <button id="btnClear">清空</button>
    </div>
  </div>
</div>
<script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
